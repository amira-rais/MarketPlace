<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - EcoShop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Barre de navigation -->
    <nav class="navbar">
        <a href="index.html" class="logo"><i class="fas fa-leaf"></i> EcoShop</a>
    </nav>

    <!-- Formulaire d'inscription -->
    <div class="signup-container">
        <h1>Créer un compte</h1>
        <form id="signup-form" class="signup-form">
            <div class="form-group">
                <label for="fullname">Nom complet</label>
                <input type="text" id="fullname" name="fullname" placeholder="Votre nom complet" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirmer le mot de passe</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmez votre mot de passe" required>
            </div>
            <button type="submit" class="btn btn-primary">S'inscrire</button>
        </form>
        <p>Déjà un compte ?</p>
        <a href="connection.html" class="btn btn-outline">Se connecter</a>
    </div>

    <script src="inscription.js"></script>
    
</body>
</html>
